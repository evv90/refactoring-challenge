[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "waqupy"
version = "0.0.1"
description = "Water Quality Package for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "ruff>=0.14.4"
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D212", "COM812",  # Rules conflict with ruff format
    "S101"  # Allow use of assert in tests
]

[tool.ruff.format]
quote-style = "double"

[[tool.mypy.overrides]]
module = "waqupy.*"
ignore_missing_imports = true
