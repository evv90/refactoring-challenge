name: DAP GitHub Actions
run-name: ${{ github.actor }} is running ruff, mypy and pytest on GitHub Actions 🚀
on: [push]
jobs:
  Run-Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
      - name: Run linters
        run: |
          ruff check .
          ruff format . --check
          mypy .
      - name: Run tests
        run: |
          pytest
